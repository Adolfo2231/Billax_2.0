services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: billax
      POSTGRES_PASSWORD: billax
      POSTGRES_DB: billax
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billax -d billax"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: Billax 2.0 API
      APP_VERSION: 0.1.0
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql://billax:billax@db:5432/billax
      TEST_DATABASE_URL: postgresql://billax:billax@db:5432/billax_test
      FRONTEND_URL: http://localhost:5173
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SECRET_KEY: docker-development-secret-key
      ALGORITHM: HS256
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
            python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: