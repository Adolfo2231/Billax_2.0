name: Backend CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: billax
          POSTGRES_PASSWORD: billax
          POSTGRES_DB: billax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billax -d billax_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Billax 2.0 API
      APP_VERSION: 0.1.0
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql://billax:billax@127.0.0.1:5432/billax_test
      TEST_DATABASE_URL: postgresql://billax:billax@127.0.0.1:5432/billax_test
      FRONTEND_URL: http://localhost:5173
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SECRET_KEY: ci-test-secret-key
      ALGORITHM: HS256

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linting
        run: python -m ruff check .

      - name: Run migrations
        run: python -m alembic upgrade head

      - name: Check migrations
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -q
